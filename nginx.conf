# ─────────────────────────────────────────────────────────────────────────────
# Nginx — La Madriguera QR System
# ─────────────────────────────────────────────────────────────────────────────
#
# INSTRUCCIONES:
# 1. Reemplaza TU_DOMINIO.COM con tu dominio real (ej. qr.lamadriguera.co)
# 2. Copia este archivo al servidor:
#      scp nginx.conf usuario@ip:/etc/nginx/sites-available/la-madriguera-qr
# 3. Crea el symlink:
#      ln -s /etc/nginx/sites-available/la-madriguera-qr /etc/nginx/sites-enabled/
# 4. Verifica la config:
#      nginx -t
# 5. Recarga nginx:
#      systemctl reload nginx
# 6. Obtén el certificado SSL (REQUERIDO para que la cámara funcione):
#      certbot --nginx -d TU_DOMINIO.COM
# ─────────────────────────────────────────────────────────────────────────────

# Redirige HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO.COM;

    return 301 https://$host$request_uri;
}

# HTTPS → proxy al backend Node.js
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name TU_DOMINIO.COM;

    # Certbot llenará estas rutas automáticamente:
    ssl_certificate     /etc/letsencrypt/live/TU_DOMINIO.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TU_DOMINIO.COM/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tamaño máximo de upload (para subir imágenes al escáner)
    client_max_body_size 10M;

    # Proxy al backend
    location / {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
